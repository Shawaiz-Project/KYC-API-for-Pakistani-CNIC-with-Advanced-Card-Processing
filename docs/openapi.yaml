openapi: 3.0.3
info:
  title: Shanakht KYC API
  version: 2.0.0
  description: Tenant-scoped KYC orchestration. Local checks are not authoritative
    identity verification.
paths:
  /api/v1/card/detector:
    post:
      operationId: api_v1_card_detector_create
      description: Compatibility adapter for the original path, field names, and keys.
      tags:
      - api
      security:
      - legacyApiKey: []
      responses:
        '200':
          description: No response body
  /api/v1/kyc/process:
    post:
      operationId: api_v1_kyc_process_create
      description: Structured Phase 1 processing contract.
      tags:
      - api
      security:
      - legacyApiKey: []
      responses:
        '200':
          description: No response body
  /api/v2/api-keys:
    get:
      operationId: api_v2_api_keys_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v2_api_keys_create
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v2/api-keys/{key_id}/actions:
    post:
      operationId: api_v2_api_keys_actions_create
      parameters:
      - in: path
        name: key_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v2/applications:
    get:
      operationId: v2_application_list
      summary: List organization-scoped KYC applications
      tags:
      - api
      security:
      - cookieAuth: []
      - organizationApiKey: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_v2_applications_create
      tags:
      - api
      security:
      - cookieAuth: []
      - organizationApiKey: []
      responses:
        '200':
          description: No response body
  /api/v2/applications/{id}:
    get:
      operationId: v2_application_retrieve
      summary: Retrieve one authorized application with evidence
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - organizationApiKey: []
      responses:
        '200':
          description: No response body
  /api/v2/applications/{id}/artifacts:
