components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    legacyApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    organizationApiKey:
      type: apiKey
      in: header
      name: X-API-Key
