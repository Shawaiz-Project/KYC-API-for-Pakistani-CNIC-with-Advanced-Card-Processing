server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 32m;

  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /health/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store" always; }
}
